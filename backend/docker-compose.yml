version: '3.8'

services:
  # The Device Monitor Service
  monitor:
    build:
      context: .
      dockerfile: services/monitor/Dockerfile
    volumes:
      - ./HVAC_Data.duckdb:/app/HVAC_Data.duckdb  # Share DB file
      - /var/run/dbus:/var/run/dbus # Required for Bluetooth on Linux
    environment:
      - PYTHONPATH=/app
    restart: always
    # Important for Bluetooth access on Raspberry Pi
    network_mode: host
    privileged: true

  # The API Service
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./HVAC_Data.duckdb:/app/HVAC_Data.duckdb  # Share DB file
    environment:
      - PYTHONPATH=/app
    depends_on:
      - monitor
    restart: always
